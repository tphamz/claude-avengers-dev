# avengers-sdd - OpenSpec schema for the Avengers /sdd standard track.
#
# Forked with `openspec schema fork spec-driven avengers-sdd` from the built-in
# `spec-driven` schema of OpenSpec 1.13.2 (@fission-ai/openspec,
# https://github.com/Fission-AI/OpenSpec), then edited: a `tests` artifact sits
# between specs/design and tasks, so failing tests are derived from the WHEN/THEN
# scenarios before any task is written. Do not rename it `spec-driven`: that would
# shadow the built-in schema and turn off OpenSpec's task-numbering check.
